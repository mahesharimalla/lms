title = "Enterprise Secret Detection Policy"

[allowlist]
description = "Ignore generated & non-developer files"
paths = [
  "node_modules/",
  "dist/",
  "build/",
  "target/",
  "coverage/",
  "security-reports/",
  "dependency-check-report.xml",
  "dependency-check-report.html",
  "dependency-check-report.json",
  ".scannerwork/"
]

[[rules]]
id = "ignore-placeholders"
description = "Ignore placeholder / non-real secrets"
regex = '''REDACTED|dummy|example|changeme'''


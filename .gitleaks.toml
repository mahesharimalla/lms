title = "Enterprise Real Secret Detection Policy"

# -------------------------------------------------
# IGNORE NON-DEVELOPER FILES (CRITICAL)
# -------------------------------------------------
[allowlist]
description = "Ignore generated, tool, and non-source files"

paths = [
  ".git/",
  ".scannerwork/",
  "node_modules/",
  "dist/",
  "build/",
  "target/",
  "coverage/",
  "security-reports/",
  "dependency-check-report.xml",
  "dependency-check-report.html",
  "dependency-check-report.json",
  "trivy-api-scan.txt"
]

# -------------------------------------------------
# IGNORE PLACEHOLDER / DUMMY VALUES
# -------------------------------------------------
regexes = [
  "REDACTED",
  "dummy",
  "example",
  "changeme",
  "test123",
  "password"
]


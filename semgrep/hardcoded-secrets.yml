rules:
  - id: hardcoded-password
    message: "Hardcoded credential detected"
    severity: ERROR
    languages: [javascript, typescript]
    patterns:
      - pattern-either:
          - pattern: |
              $VAR = "$SECRET"
          - pattern: |
              $VAR: "$SECRET"
    metavariable-regex:
      metavariable: $VAR
      regex: (?i)(password|passwd|pwd|secret|token|key|jwt)
